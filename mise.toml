[tools]
java = "openjdk-21"
node = "24"

[env]
ANDROID_HOME = "/home/armaldio/Android/Sdk"

[tasks.dev]
run = "pnpm dev"

[tasks.build-prod]
run = "pnpm build"
env = { NODE_ENV = "production" }

[tasks.build-dev]
run = "pnpm build"

[tasks.sync-dev]
run = "pnpm cap sync"
depends = ["build-dev"]

[tasks.sync-prod]
run = "pnpm cap sync"
depends = ["build-prod"]

[tasks.open-android-dev]
run = "pnpm cap open android"
depends = ["sync-dev"]

[tasks.open-android-prod]
run = "pnpm cap open android"
depends = ["sync-prod"]

[tasks.build-android-dev]
run = "pnpm cap build android"
depends = ["sync-dev"]

[tasks.build-android-prod]
run = "pnpm cap build android"
depends = ["sync-prod"]

[tasks.run-android-dev]
run = "pnpm cap run android"
env = { NODE_ENV = "development" }
depends = ["sync-dev"]

[tasks.run-android-prod]
run = "pnpm cap run android"
env = { NODE_ENV = "production" }
depends = ["sync-prod"]

[tasks.bump-version]
description = "Bump package.json version and mirror to android/app/build.gradle. Use: mise run bump-version 1.3.1"
run = "./scripts/release.sh bump"

[tasks."release:stable"]
description = "Bump version, commit, tag vX.Y.Z, push. Use: mise run release:stable 1.3.1"
run = "./scripts/release.sh release:stable"

[tasks."release:beta"]
description = "Bump to next prerelease, commit, tag, push. Use: mise run release:beta [bump|1.3.1-beta.1]"
run = "./scripts/release.sh release:beta"
