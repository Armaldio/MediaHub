[tools]
java = "openjdk-21"
node = "24"

[env]
ANDROID_HOME = "/home/armaldio/Android/Sdk"

[tasks.dev]
run = "pnpm dev"

[tasks.build-prod]
run = "pnpm build"
env = { NODE_ENV = "production" }

[tasks.build-dev]
run = "pnpm build"

[tasks.sync-dev]
run = "pnpm cap sync"
depends = ["build-dev"]

[tasks.sync-prod]
run = "pnpm cap sync"
depends = ["build-prod"]

[tasks.open-android-dev]
run = "pnpm cap open android"
depends = ["sync-dev"]

[tasks.open-android-prod]
run = "pnpm cap open android"
depends = ["sync-prod"]

[tasks.build-android-dev]
run = "pnpm cap build android"
depends = ["sync-dev"]

[tasks.build-android-prod]
run = "pnpm cap build android"
depends = ["sync-prod"]

[tasks.run-android-dev]
run = "pnpm cap run android"
env = { NODE_ENV = "development" }
depends = ["sync-dev"]

[tasks.run-android-prod]
run = "pnpm cap run android"
env = { NODE_ENV = "production" }
depends = ["sync-prod"]

[tasks.bump-version]
description = "Bump package.json version and mirror to android/app/build.gradle. Use: mise run bump-version 1.3.1"
run = "./scripts/release.sh bump"

[tasks."release:stable"]
description = "Bump version, commit, tag vX.Y.Z, push. Use: mise run release:stable 1.3.1"
run = "./scripts/release.sh release:stable"

[tasks."release:beta"]
description = "Bump to next prerelease, commit, tag, push. Use: mise run release:beta [bump|1.3.1-beta.1]"
run = "./scripts/release.sh release:beta"

[tasks."apk:extract"]
description = "Extract deep links from APK/XAPK or appId (needs APK file or apkeep). Use: mise run apk:extract -- <apk|appId> [-- --json] [-- --deep-only]"
run = 'npx tsx scripts/apk-deep-links.ts extract "$@"'

[tasks."apk:validate"]
description = "Validate service deepLinks (guards, schemes). Use: mise run apk:validate [-- --apk <apk>] [-- --service <id>] [-- --json]"
run = 'npx tsx scripts/apk-deep-links.ts validate "$@"'

[tasks."apk:download"]
description = "Download APK via apkeep if installed. Use: mise run apk:download -- <appId> [-- --out <dir>]"
run = 'npx tsx scripts/apk-deep-links.ts download "$@"'

[tasks."deep-links:extract"]
description = "Alias for apk:extract"
run = 'npx tsx scripts/apk-deep-links.ts extract "$@"'

[tasks."deep-links:validate"]
description = "Alias for apk:validate"
run = 'npx tsx scripts/apk-deep-links.ts validate "$@"'

[tasks."apk:extract-icon"]
description = "Extract launcher icon from APK (better than Play Store). Use: mise run apk:extract-icon -- <apk|appId> [-- --out <path>]"
run = 'npx tsx scripts/apk-deep-links.ts extract-icon "$@"'
