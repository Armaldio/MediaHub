[tools]
java = "openjdk-21"
node = "24"

[env]
ANDROID_HOME = "/home/armaldio/Android/Sdk"

[tasks.dev]
run = "pnpm dev"

[tasks.build-prod]
run = "pnpm build"
env = { NODE_ENV = "production" }

[tasks.build-dev]
run = "pnpm build"

[tasks.sync-dev]
run = "pnpm cap sync"
depends = ["build-dev"]

[tasks.sync-prod]
run = "pnpm cap sync"
depends = ["build-prod"]

[tasks.open-android-dev]
run = "pnpm cap open android"
depends = ["sync-dev"]

[tasks.open-android-prod]
run = "pnpm cap open android"
depends = ["sync-prod"]

[tasks.build-android-dev]
run = "pnpm cap build android"
depends = ["sync-dev"]

[tasks.build-android-prod]
run = "pnpm cap build android"
depends = ["sync-prod"]

[tasks.run-android-dev]
run = "pnpm cap run android"
env = { NODE_ENV = "development" }
depends = ["sync-dev"]

[tasks.run-android-prod]
run = "pnpm cap run android"
env = { NODE_ENV = "production" }
depends = ["sync-prod"]

# --- Changesets-based release tasks ---

[tasks.changeset]
description = "Add a changeset describing your change (patch/minor/major)"
run = "pnpm changeset"

[tasks.version]
description = "Bump versions + update CHANGELOG from pending changesets"
run = "pnpm changeset version"

[tasks.tag]
description = "Create the vX.Y.Z git tag for the current package version"
run = "node .github/workflows/tag-release.mjs"

[tasks.release]
description = "Version, commit, tag (v*), and push to trigger the Android build"
run = '''
set -euo pipefail
pnpm changeset version
VERSION=$(node -p "require('./package.json').version")
git add -A
git commit -m "chore: release v$VERSION" || echo "nothing to commit"
node .github/workflows/tag-release.mjs
TAG="v$VERSION"
if git rev-parse "$TAG" >/dev/null 2>&1; then
  git push origin "$TAG"
  echo "» Pushed $TAG - Android build will run (internal Play track)."
else
  echo "» Tag $TAG not created (already exists or no version bump); skipping push."
fi
'''
