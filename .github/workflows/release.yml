name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # Opens a "Version Packages" PR when changesets exist; on merge it runs
      # `changeset version` (bump + changelog) and then tags the release with a
      # `vX.Y.Z` git tag. That tag triggers the Android build workflow
      # (internal Play track only).
      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: node .github/workflows/tag-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
