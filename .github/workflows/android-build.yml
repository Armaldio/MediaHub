name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          pnpm install

      - name: Setup Android signing - Capacitor
        run: |
          base64 -d <<< "${{ secrets.KEYSTORE_FILE }}" > ./android/media-hub-keystore.jks

      - name: Compute build suffix and versionCode
        if: github.event_name != 'pull_request'
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          RUN_NUMBER="${{ github.run_number }}"
          if [ "$IS_TAG" = "true" ]; then
            DISPLAY_VERSION="$BASE_VERSION"
            VERSION_CODE_OFFSET=0
          else
            DISPLAY_VERSION="${BASE_VERSION}-ci${RUN_NUMBER}"
            VERSION_CODE_OFFSET="$RUN_NUMBER"
          fi
          BASE_CODE=$(node -p "const v='$BASE_VERSION'.match(/^[0-9]+\.[0-9]+\.[0-9]+/)[0].split('.').map(Number);v[0]*1000000+v[1]*1000+v[2];")
          VERSION_CODE=$((BASE_CODE + VERSION_CODE_OFFSET))
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Display version: $DISPLAY_VERSION"
          echo "Version code: $VERSION_CODE"

      - name: Apply version to gradle build
        if: github.event_name != 'pull_request'
        working-directory: android
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle | head -3

      - name: Build Android Release
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        env:
          KEY_ALIAS: ${{secrets.KEY_ALIAS}}
          KEY_PASSWORD: ${{secrets.KEY_PASSWORD}}
          KEYSTORE_PASSWORD: ${{secrets.KEYSTORE_PASSWORD}}
          KEYSTORE_FILE: ${{secrets.KEYSTORE_FILE}}
          VITE_TMDB_API_KEY: ${{secrets.VITE_TMDB_API_KEY}}
          VITE_TVDB_API_KEY: ${{secrets.VITE_TVDB_API_KEY}}
          VITE_REVENUECAT_API_KEY: ${{secrets.VITE_REVENUECAT_API_KEY}}
        run: |
          pnpm build
          pnpm cap sync
          pnpm cap build android --androidreleasetype AAB
          pnpm cap build android --androidreleasetype APK

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle-${{ steps.version.outputs.display_version }}
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 30
        continue-on-error: false

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release-${{ steps.version.outputs.display_version }}
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30
        continue-on-error: false

  upload:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag info
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qE 'beta|alpha|rc'; then
            echo "track=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "track=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute artifact name
        id: artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=android-app-bundle-$VERSION" >> "$GITHUB_OUTPUT"
          echo "Artifact: android-app-bundle-$VERSION"

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .

      - name: Upload .aab to Google Play
        uses: KevinRohn/github-action-upload-play-store@v1.0.1
        with:
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          package_name: "xyz.armaldio.mediahub.app"
          aab_file_path: "app-release-signed.aab"
          track: ${{ steps.tag.outputs.track }}
          release_status: "completed"
